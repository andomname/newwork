
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Demo</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  color: #1c1e21;
}

.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 60px;
  padding: 20px;
}

.left {
  max-width: 420px;
}

.logo {
  color: #1877f2;
  font-size: 46px;
  font-weight: bold;
  margin-bottom: 12px;
}

.left p {
  font-size: 22px;
  line-height: 1.5;
}

.card {
  width: 396px;
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

.notice {
  background: #e7f3ff;
  color: #174a80;
  padding: 11px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 16px;
}

input {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #dddfe2;
  border-radius: 6px;
  font-size: 16px;
}

input:focus {
  outline: none;
  border-color: #1877f2;
}

.submit-btn {
  width: 100%;
  padding: 13px;
  background: #1877f2;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.submit-btn:hover {
  background: #166fe5;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.forgot {
  display: block;
  text-align: center;
  color: #1877f2;
  text-decoration: none;
  font-size: 16px;
  margin: 17px 0;
}

.forgot:hover {
  text-decoration: underline;
}

.divider {
  border: 0;
  border-top: 1px solid #dadde1;
  margin: 20px 0;
}

.create-account {
  display: block;
  width: fit-content;
  margin: 0 auto;
  padding: 14px 25px;
  background: #36b52b;
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  border-radius: 8px;
}

.create-account:hover {
  background: #2e9f25;
}

.status {
  margin-top: 14px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

@media(max-width: 768px) {
  .container {
    flex-direction: column;
    gap: 25px;
    text-align: center;
  }

  .logo {
    font-size: 38px;
  }

  .left p {
    font-size: 18px;
  }

  .card {
    width: 100%;
    max-width: 396px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="left">
    <div class="logo">Social Demo</div>

    <p>
      এটি একটি পরীক্ষামূলক ওয়েব ফর্ম।
      HTML, CSS এবং Google Sheets সংযোগ শেখার জন্য তৈরি।
    </p>
  </div>

  <div class="card">

    <div class="notice">
      শিক্ষামূলক ডেমো: এখানে শুধু কাল্পনিক নাম,
      পরীক্ষামূলক ইমেইল ও সাধারণ নোট ব্যবহার করুন।
      কোনো পাসওয়ার্ড দেবেন না।
    </div>

    <form id="demoForm">

      <input
        type="text"
        name="name"
        placeholder="ডেমো নাম"
        maxlength="100"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="পরীক্ষামূলক ইমেইল"
        maxlength="120"
        required
      >

      <input
        type="text"
        name="note"
        placeholder="পরীক্ষামূলক নোট"
        maxlength="200"
      >

      <button class="submit-btn" type="submit">
        Submit Demo
      </button>

      <a href="#" class="forgot"
         onclick="return false;">
        Forgot demo details?
      </a>

      <hr class="divider">

      <a href="#" class="create-account"
         onclick="return false;">
        Create demo profile
      </a>

    </form>

    <p id="status" class="status" aria-live="polite"></p>

  </div>
</div>

<script>

// Google Apps Script Web App URL
const scriptURL =
"https://script.google.com/macros/s/AKfycbytSGynLJMPPqF57tIjtAwKOnX81GWspo4nBq1QYzZZuDfaLzn_NzM5bAcUhEZrxdxejA/exec";

const form = document.getElementById("demoForm");
const statusText = document.getElementById("status");
const submitButton = form.querySelector(".submit-btn");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!form.reportValidity()) {
    return;
  }

  submitButton.disabled = true;
  statusText.textContent = "তথ্য পাঠানো হচ্ছে...";

  try {

    const formData = new FormData(form);
    const data = new URLSearchParams();

    for (const [key, value] of formData.entries()) {
      data.append(key, value);
    }

    await fetch(scriptURL, {
      method: "POST",
      mode: "no-cors",
      body: data
    });

    statusText.textContent =
      "অনুরোধ পাঠানো হয়েছে। Google Sheet-এ নতুন Row এসেছে কি না যাচাই করুন।";

    form.reset();

  } catch (error) {

    statusText.textContent =
      "অনুরোধ পাঠানো যায়নি। ইন্টারনেট ও Apps Script URL পরীক্ষা করুন।";

    console.error(error);

  } finally {

    submitButton.disabled = false;

  }

});

</script>

</body>
</html>
